services:
  - type: web
    name: briefly
    runtime: ruby
    plan: free
    buildCommand: bin/render-build.sh
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    initialDeployHook: bin/rails db:seed
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: briefly.onrender.com
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
