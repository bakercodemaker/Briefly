services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      OWNER_PASSWORD: ${OWNER_PASSWORD:-briefly-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAILS_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
      - node_modules:/app/node_modules
      - storage:/app/storage

volumes:
  bundle:
  node_modules:
  storage:
